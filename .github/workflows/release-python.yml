# Python パッケージ kura-rs を PyPI に公開する。
# タグ py-v<版>（例: py-v0.1.0）を push すると動く。crates/kura-py/Cargo.toml の version と合わせること。
#
# 事前の準備（1回だけ）: PyPI で「信頼できる公開元（Trusted Publisher）」を登録する
#   Owner: h-kurashina / Repository: kura-rs / Workflow: release-python.yml / Environment: pypi
name: Release Python package

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64 }
          - { name: macos-arm64, runner: macos-latest, target: aarch64 }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64 }
          - { name: windows-x86_64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/kura-py
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: crates/kura-py/dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/kura-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: crates/kura-py/dist

  # できたファイルを、そのまま入れてテストする（公開する前の最後の確認）
  test-wheels:
    name: Test wheel (${{ matrix.runner }})
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install the wheel and test
        shell: bash
        run: |
          pip install --no-index --find-links dist kura-rs
          pip install "pytest>=8" "hypothesis>=6" "datasketch==2.0.0" "numpy==2.5.3"
          cd crates/kura-py && pytest -q -p no:cacheprovider --import-mode=importlib tests

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist, test-wheels]
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing（パスワードやトークンを使わない）
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
